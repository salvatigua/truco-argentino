services:
  postgres:
    image: postgres:16-alpine
    container_name: truco_postgres
    restart: always
    environment:
      POSTGRES_USER: truco_user
      POSTGRES_PASSWORD: truco_password
      POSTGRES_DB: truco_db
    ports:
      - "5435:5432" # Mapea el puerto 5435 de Windows al 5432 interno del contenedor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: truco_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Dentro de Docker, el backend siempre habla con "postgres:5432" por la red interna
      DATABASE_URL: "postgresql://truco_user:truco_password@postgres:5432/truco_db?schema=public"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared:/app/packages/shared
      - /app/apps/backend/node_modules
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: truco_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3000"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
      - /app/apps/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: